<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pringles Price Index (PPI)</title>

<!-- Chart.js + date adapter -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #fafafa; }
  #container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 6px; box-shadow: 0 0 6px rgba(0,0,0,0.1); }
  h1 { text-align: center; }
  #chartContainer { width: 100%; height: 400px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; display: none; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #eee; }
  button { margin-top: 10px; padding: 8px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #2980b9; }
</style>
</head>
<body>

<div id="container">
  <h1>Pringles Price Index (PPI)</h1>
  <p>Data tracking 185g Original</p>
  <canvas id="chartContainer"></canvas>
  <button id="toggleButton">Show Raw Data</button>
  <table id="dataTable"></table>
</div>

<script>
const data = [
  { date: "2025-10-28", price: 1.50, shop: "Tesco" },
  { date: "2025-10-28", price: 2.50, shop: "Sainsburys" },
  { date: "2025-10-28", price: 1.48, shop: "Asda" },
  { date: "2025-09-10", price: 2.50, shop: "Tesco" },
  { date: "2025-09-10", price: 2.50, shop: "Sainsburys" },
  { date: "2025-09-10", price: 2.50, shop: "Asda" },

];

// Set shop colours
const shopColors = {
  "Asda": "#7dc242",
  "Tesco": "#00539F", 
  "Sainsburys": "#F06C00",
};


// Group data by shop
const shops = {};
data.forEach(d => {
  if (!shops[d.shop]) shops[d.shop] = [];
  shops[d.shop].push({ x: d.date, y: d.price });
});

// Create Chart.js datasets
const datasets = Object.keys(shops).map(shop => ({
  label: shop,
  data: shops[shop],
  borderColor: shopColors[shop] || "#888",       // fallback if missing
  backgroundColor: (shopColors[shop] || "#888") + "55",
  tension: 0.3
}));


// Build chart
const ctx = document.getElementById('chartContainer').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: { datasets },
  options: {
    responsive: true,
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
      title: { display: true, text: 'Price over Time' },
      tooltip: { enabled: true },
      legend: { position: 'top' }
    },
    scales: {
      x: {
        type: 'time',
        time: { unit: 'day', tooltipFormat: 'yyyy-MM-dd' },
        title: { display: true, text: 'Date' }
      },
      y: {
        title: { display: true, text: 'Price (£)' },
        beginAtZero: false
      }
    }
  }
});

// ---- Raw data table ----
const table = document.getElementById('dataTable');
const btn = document.getElementById('toggleButton');
btn.addEventListener('click', () => {
  if (table.style.display === 'none' || table.style.display === '') {
    table.style.display = 'table';
    btn.textContent = 'Hide Raw Data';
  } else {
    table.style.display = 'none';
    btn.textContent = 'Show Raw Data';
  }
});
function buildTable() {
  const header = `<tr><th>Date</th><th>Price</th><th>Shop</th></tr>`;
  const rows = data.map(d => 
    `<tr><td>${d.date}</td><td>${d.price}</td><td>${d.shop}</td></tr>`
  ).join('');
  table.innerHTML = header + rows;
}

// ---- Find cheapest shop(s) on most recent date ----

// 1️⃣ Find the most recent date
const mostRecentDate = data.reduce((latest, d) => 
  new Date(d.date) > new Date(latest) ? d.date : latest,
  data[0].date
);

// 2️⃣ Filter items from that date only
const recentItems = data.filter(d => d.date === mostRecentDate);

// 3️⃣ Find the minimum price among them
const minPrice = Math.min(...recentItems.map(d => d.price));

// 4️⃣ Get all shops that have that minimum price
const cheapestShops = recentItems
  .filter(d => d.price === minPrice)
  .map(d => d.shop);

// 5️⃣ Display it in a summary div
const summaryDiv = document.createElement('div');
summaryDiv.style.textAlign = 'center';
summaryDiv.style.margin = '20px 0';
summaryDiv.style.padding = '10px';
summaryDiv.style.background = '#e8f8f5';
summaryDiv.style.border = '1px solid #b2dfdb';
summaryDiv.style.borderRadius = '6px';
summaryDiv.innerHTML = `
  <strong>🛒 Cheapest supermarket${cheapestShops.length > 1 ? 's' : ''} on ${mostRecentDate}:</strong><br>
  ${cheapestShops.join(', ')} — £${minPrice}
`;
document.getElementById('container').insertBefore(summaryDiv, document.getElementById('chartContainer'));






data.sort((a, b) => new Date(b.date) - new Date(a.date));
buildTable();
</script>

</body>
</html>
