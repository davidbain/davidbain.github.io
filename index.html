<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="David Bain - IT professional and general tech enthusiast">
    <title>David Bain</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
            padding: 3rem 1.5rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border-left: 2px solid #000;
            padding-left: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.25rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .social-links {
            display: flex;
            justify-content: flex-start;
            gap: 1.5rem;
            margin-bottom: 4rem;
            flex-wrap: wrap;
        }
        .social-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 2px solid #000;
            border-radius: 2px;
            text-decoration: none;
            color: #000;
            transition: all 0.25s ease;
            background: #fff;
        }
        .social-link:hover {
            background: #00d84b;
            border-color: #00d84b;
            color: #000;
            transform: scale(1.08);
        }
        .social-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            stroke: currentColor;
        }
        .social-text {
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 500;
        }
        .projects {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }
        .project-btn {
            background: #fff;
            color: #000;
            padding: 1rem 1.25rem;
            border: 2px solid #000;
            border-radius: 2px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: all 0.25s ease;
            text-align: left;
            letter-spacing: -0.01em;
        }
        .project-btn:hover {
            background: #00d84b;
            border-color: #00d84b;
            color: #000;
        }
        @media (max-width: 480px) {
            body {
                padding: 2rem 1rem;
            }
            .container {
                border-left: none;
                border-top: 2px solid #000;
                padding-left: 0;
                padding-top: 2rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .social-links {
                gap: 1rem;
            }
            .social-link {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>David Bain</h1>
        <p class="subtitle">IT professional and general tech enthusiast</p>
        <div class="social-links">
            <div class="social-item">
                <a href="http://linkedin.com/in/davidjbain/" class="social-link" title="LinkedIn" aria-label="Visit my LinkedIn profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
                        <rect x="2" y="9" width="4" height="12"/>
                        <circle cx="4" cy="4" r="2"/>
                    </svg>
                </a>
                <span class="social-text">LinkedIn</span>
            </div>
            <div class="social-item">
                <a href="https://bsky.app/profile/davidbain.bsky.social" class="social-link" title="Bluesky" aria-label="Visit my Bluesky profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                    </svg>
                </a>
                <span class="social-text">Bluesky</span>
            </div>
            <div class="social-item">
                <a href="https://github.com/davidbain?tab=repositories" class="social-link" title="GitHub" aria-label="Visit my GitHub profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                    </svg>
                </a>
                <span class="social-text">GitHub</span>
            </div>
            <div class="social-item">
                <a href="http://t.me/davidjbain" class="social-link" title="Telegram" aria-label="Visit my Telegram profile">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m22 2-7 20-4-9-9-4z"/>
                        <path d="M22 2 11 13"/>
                    </svg>
                </a>
                <span class="social-text">Telegram</span>
            </div>
        </div><!-- END .social-links-->
        <div style="height: 50px;"></div>
        <div class="projects">
            <a href="https://davidasaservice.com/" class="project-btn" aria-label="Visit my blog David as a Service">David as a Service - Blog</a>
        </div><!-- END .projects -->
    </div><!-- END .container -->
</body>
</html>
